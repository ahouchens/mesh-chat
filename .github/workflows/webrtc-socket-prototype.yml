name: WebRTC selected TURN socket prototype

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/**'
    paths:
      - '.github/workflows/webrtc-socket-prototype.yml'
      - 'scripts/webrtc_socket_prototype.py'
      - 'service/tests/connection/test_ui_core_boundary_webrtc_socket_prototype.py'
      - 'third_party/webrtc/patches/selected-turn-socket.patch'
      - 'third_party/webrtc/README.md'

permissions:
  contents: read

concurrency:
  group: webrtc-socket-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-linux-cpp:
    name: Pinned WebRTC Linux C++ tests only
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify offline prototype input gates
        run: python3 -m unittest discover -s service/tests/connection -p test_ui_core_boundary_webrtc_socket_prototype.py
      - name: Record runner and run pinned focused native tests
        run: |
          python3 --version
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          python3 scripts/webrtc_socket_prototype.py run \
            --repo "$GITHUB_WORKSPACE" \
            --work-dir "$RUNNER_TEMP/webrtc-socket-prototype" \
            --evidence-dir "$GITHUB_WORKSPACE/dist/reports/webrtc-socket-prototype"
      - name: Retain prototype logs, resolved inputs, and test XML
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webrtc-socket-prototype-${{ github.sha }}
          path: dist/reports/webrtc-socket-prototype/
          if-no-files-found: warn
          retention-days: 7
