name: Connection qualification

on:
  pull_request:
  push:
    branches: [main, codex/direct-connectivity]
  merge_group:
  workflow_dispatch:
    inputs:
      b8_first_cold_diagnostic:
        description: Run one paired first cold diagnostic after same-source producers
        type: boolean
        required: false
        default: false
      public_pair_diagnostic:
        description: Run one installed public Windows and Android fresh-pair diagnostic
        type: boolean
        required: false
        default: false
      public_restart_diagnostic:
        description: Restart the installed public Windows owner while Android remains alive
        type: boolean
        required: false
        default: false
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && ((inputs.b8_first_cold_diagnostic && (inputs.public_pair_diagnostic || inputs.public_restart_diagnostic)) || (inputs.public_pair_diagnostic && inputs.public_restart_diagnostic)) && 'connection-diagnostic-conflict' || github.event_name == 'workflow_dispatch' && inputs.b8_first_cold_diagnostic && 'connection-b8-diagnostic' || github.event_name == 'workflow_dispatch' && (inputs.public_pair_diagnostic || inputs.public_restart_diagnostic) && 'connection-public-pair-diagnostic' || 'connection-qualification' }}-${{ github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.b8_first_cold_diagnostic || inputs.public_pair_diagnostic || inputs.public_restart_diagnostic)) }}

jobs:
  diagnostic_conflict:
    name: Reject conflicting manual diagnostics
    if: ${{ github.event_name == 'workflow_dispatch' && ((inputs.b8_first_cold_diagnostic && (inputs.public_pair_diagnostic || inputs.public_restart_diagnostic)) || (inputs.public_pair_diagnostic && inputs.public_restart_diagnostic)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: exit 1

  plan:
    name: Select dependent qualification suites
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.b8_first_cold_diagnostic || inputs.public_pair_diagnostic || inputs.public_restart_diagnostic)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      policy: ${{ steps.select.outputs.policy }}
      verification: ${{ steps.select.outputs.verification }}
      android: ${{ steps.select.outputs.android }}
      direct: ${{ steps.select.outputs.direct }}
      layout: ${{ steps.select.outputs.layout }}
      native_interop: ${{ steps.select.outputs.native_interop }}
      native_workload: ${{ steps.select.outputs.native_workload }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: select
        run: python scripts/connection_ci.py --output dist/reports/connection-selection.json
      - uses: actions/upload-artifact@v4
        with:
          name: connection-selection-${{ github.sha }}
          path: dist/reports/connection-selection.json
          if-no-files-found: error

  policy:
    needs: plan
    if: needs.plan.outputs.policy == 'true'
    uses: ./.github/workflows/connection-runtime.yml

  verification:
    needs: plan
    if: needs.plan.outputs.verification == 'true'
    uses: ./.github/workflows/ci.yml

  android:
    needs: plan
    if: needs.plan.outputs.android == 'true'
    uses: ./.github/workflows/android-webrtc.yml

  direct:
    needs: plan
    if: needs.plan.outputs.direct == 'true'
    uses: ./.github/workflows/direct-fabric-proof.yml

  layout:
    needs: plan
    if: needs.plan.outputs.layout == 'true'
    uses: ./.github/workflows/connection-layout.yml

  native_interop:
    needs: [plan, verification, android]
    if: needs.plan.outputs.native_interop == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/native-interop.yml
    with:
      workload: ${{ needs.plan.outputs.native_workload }}

  b8_first_cold_diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.b8_first_cold_diagnostic && !inputs.public_pair_diagnostic && !inputs.public_restart_diagnostic }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/native-interop-b8-diagnostic.yml

  public_pair_diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.public_pair_diagnostic || inputs.public_restart_diagnostic) && !(inputs.public_pair_diagnostic && inputs.public_restart_diagnostic) && !inputs.b8_first_cold_diagnostic }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/public-core-pair-diagnostic.yml
    with:
      owner_restart: ${{ inputs.public_restart_diagnostic }}

  gate:
    name: Required connection qualification gate
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && (inputs.b8_first_cold_diagnostic || inputs.public_pair_diagnostic || inputs.public_restart_diagnostic)) }}
    needs: [plan, policy, verification, android, direct, layout, native_interop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.native_interop == 'true'
        with:
          name: native-interop-windows-${{ github.sha }}
          path: dist/qualification/native-interop
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.native_interop == 'true'
        with:
          name: native-interop-android-${{ github.sha }}
          path: dist/qualification/native-interop
      - uses: actions/download-artifact@v4
        with:
          name: connection-selection-${{ github.sha }}
          path: dist/reports
      - uses: actions/download-artifact@v4
        with:
          name: connection-policy-${{ github.sha }}
          path: dist/qualification/policy
      - uses: actions/download-artifact@v4
        with:
          name: desktop-transport-${{ github.sha }}
          path: dist/qualification/desktop
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.verification == 'true'
        with:
          name: mesh-chat-verification
          path: dist/qualification/verification
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.android == 'true'
        with:
          name: android-qualification-${{ github.sha }}
          path: dist/qualification/android
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.direct == 'true'
        with:
          name: direct-qualification-Linux-${{ github.sha }}
          path: dist/qualification/direct-Linux
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.direct == 'true'
        with:
          name: direct-qualification-Windows-${{ github.sha }}
          path: dist/qualification/direct-Windows
      - name: Reject missing, failed, canceled or unexpectedly skipped suites
        env:
          QUALIFICATION_NEEDS: ${{ toJSON(needs) }}
        run: >-
          python scripts/connection_ci.py
          --check-plan dist/reports/connection-selection.json
          --evidence-dir dist/qualification
          --output dist/reports/connection-qualification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connection-qualification-${{ github.sha }}
          path: dist/reports/connection-qualification.json
          if-no-files-found: error
