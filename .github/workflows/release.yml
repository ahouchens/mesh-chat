name: Release build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (for example, 1.2.3 or v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          version="${REQUESTED_VERSION#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid semantic version: $REQUESTED_VERSION" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 11.25.0
          runtime: node@24
          cache: true
          install: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            service/requirements.lock
            service/requirements-dev.lock

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r service/requirements-dev.lock

      - name: Validate and run the test suite once
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/release.py verify --expected-version "$RELEASE_VERSION"

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-chat-${{ steps.version.outputs.version || 'invalid-version' }}-verification
          path: dist/reports/**
          if-no-files-found: ignore
          retention-days: 30

  desktop:
    name: Build Windows desktop
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 11.25.0
          runtime: node@24
          cache: true
          install: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            service/requirements.lock
            service/requirements-dev.lock

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-windows-desktop
          cache-on-failure: true

      - name: Restore verified PyInstaller stage
        uses: actions/cache@v5
        with:
          path: |
            service/build
            service/dist
            src-tauri/binaries
          key: pyinstaller-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('service/src/**/*.py', 'service/entrypoint.py', 'service/mesh-chat-service.spec', 'service/requirements*.lock', 'service/pyproject.toml', 'scripts/build_sidecar.py') }}

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r service/requirements-dev.lock

      - name: Build and verify desktop artifacts
        run: python scripts/release.py build --platform desktop --skip-tests --expected-version "${{ needs.verify.outputs.version }}"

      - name: Test embedded native host and renderer boundaries
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Upload desktop artifacts and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-chat-${{ needs.verify.outputs.version }}-windows-desktop
          path: |
            dist/desktop/**
            dist/reports/**
          if-no-files-found: warn
          retention-days: 30

  android:
    name: Build Android arm64
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MESH_CHAT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MESH_CHAT_ANDROID_KEYSTORE_PASSWORD }}
      MESH_CHAT_ANDROID_KEY_ALIAS: ${{ secrets.MESH_CHAT_ANDROID_KEY_ALIAS }}
      MESH_CHAT_ANDROID_KEY_PASSWORD: ${{ secrets.MESH_CHAT_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 11.25.0
          runtime: node@24
          cache: true
          install: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            service/requirements.lock
            service/requirements-dev.lock

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: aarch64-linux-android

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-android-arm64
          cache-on-failure: true

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r service/requirements-dev.lock

      - name: Restore Android release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MESH_CHAT_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          keystore="$RUNNER_TEMP/mesh-chat-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "MESH_CHAT_ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build and verify signed Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release.py check --expected-version "${{ needs.verify.outputs.version }}"
          python scripts/build_android.py --release

      - name: Upload Android artifacts and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-chat-${{ needs.verify.outputs.version }}-android-arm64
          path: |
            dist/mobile/**
            dist/reports/**
          if-no-files-found: warn
          retention-days: 30

  qualification:
    name: Required connection qualification
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    uses: ./.github/workflows/connection-qualification.yml

  qualify:
    name: Bind release artifacts to qualification evidence
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, desktop, android, qualification]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download required connection qualification
        uses: actions/download-artifact@v5
        with:
          name: connection-qualification-${{ github.sha }}
          path: dist/reports

      - name: Download verified Windows artifacts
        uses: actions/download-artifact@v5
        with:
          name: mesh-chat-${{ needs.verify.outputs.version }}-windows-desktop
          path: release-input/windows

      - name: Download verified Android artifacts
        uses: actions/download-artifact@v5
        with:
          name: mesh-chat-${{ needs.verify.outputs.version }}-android-arm64
          path: release-input/android

      - name: Stage the exact release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -d '' windows_exe < <(find release-input/windows -type f -path "*/releases/$RELEASE_VERSION/x86_64-pc-windows-msvc/bundle/nsis/*.exe" -print0)
          mapfile -d '' windows_msi < <(find release-input/windows -type f -path "*/releases/$RELEASE_VERSION/x86_64-pc-windows-msvc/bundle/msi/*.msi" -print0)
          mapfile -d '' android_apk < <(find release-input/android -type f -name "mesh-chat-$RELEASE_VERSION-android-arm64-release.apk" -not -path "*/releases/*" -print0)
          if (( ${#windows_exe[@]} != 1 || ${#windows_msi[@]} != 1 || ${#android_apk[@]} != 1 )); then
            echo "Expected exactly one verified NSIS installer, MSI, and signed Android APK" >&2
            exit 1
          fi
          mkdir -p release-assets
          cp "${windows_exe[0]}" "release-assets/Mesh-Chat_${RELEASE_VERSION}_x64-setup.exe"
          cp "${windows_msi[0]}" "release-assets/Mesh-Chat_${RELEASE_VERSION}_x64_en-US.msi"
          cp "${android_apk[0]}" "release-assets/mesh-chat-${RELEASE_VERSION}-android-arm64-release.apk"
          (cd release-assets && sha256sum -- * > SHA256SUMS.txt)

      - name: Qualify the exact release artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/release_qualification.py             --qualification dist/reports/connection-qualification.json             --artifact "setup=release-assets/Mesh-Chat_${RELEASE_VERSION}_x64-setup.exe"             --artifact "msi=release-assets/Mesh-Chat_${RELEASE_VERSION}_x64_en-US.msi"             --artifact "apk=release-assets/mesh-chat-${RELEASE_VERSION}-android-arm64-release.apk"             --source "${{ github.sha }}"             --tree "$(git rev-parse HEAD^{tree})"             --version "$RELEASE_VERSION"             --output dist/reports/release-qualification.json

      - name: Upload qualified assets and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-qualification-${{ github.sha }}
          path: |
            release-assets/**
            dist/reports/release-qualification.json
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - verify
      - desktop
      - android
      - qualification
      - qualify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified Windows artifacts
        uses: actions/download-artifact@v5
        with:
          name: mesh-chat-${{ needs.verify.outputs.version }}-windows-desktop
          path: release-input/windows

      - name: Download verified Android artifacts
        uses: actions/download-artifact@v5
        with:
          name: mesh-chat-${{ needs.verify.outputs.version }}-android-arm64
          path: release-input/android

      - name: Stage public release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -d '' windows_exe < <(find release-input/windows -type f -path "*/releases/$RELEASE_VERSION/x86_64-pc-windows-msvc/bundle/nsis/*.exe" -print0)
          mapfile -d '' windows_msi < <(find release-input/windows -type f -path "*/releases/$RELEASE_VERSION/x86_64-pc-windows-msvc/bundle/msi/*.msi" -print0)
          mapfile -d '' android_apk < <(find release-input/android -type f -name "mesh-chat-$RELEASE_VERSION-android-arm64-release.apk" -not -path "*/releases/*" -print0)
          if (( ${#windows_exe[@]} != 1 || ${#windows_msi[@]} != 1 || ${#android_apk[@]} != 1 )); then
            echo "Expected exactly one verified NSIS installer, MSI, and signed Android APK" >&2
            exit 1
          fi
          mkdir release-assets
          cp "${windows_exe[0]}" "release-assets/Mesh-Chat_${RELEASE_VERSION}_x64-setup.exe"
          cp "${windows_msi[0]}" "release-assets/Mesh-Chat_${RELEASE_VERSION}_x64_en-US.msi"
          cp "${android_apk[0]}" release-assets/
          (cd release-assets && sha256sum -- * > SHA256SUMS.txt)

      - name: Download the release qualification manifest
        uses: actions/download-artifact@v5
        with:
          name: release-qualification-${{ github.sha }}
          path: release-evidence

      - name: Require the qualified bytes before publishing
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_release_assets.py \
            --manifest release-evidence/dist/reports/release-qualification.json \
            --assets release-assets

      - name: Create persistent GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "Mesh Chat $RELEASE_VERSION"
          fi
