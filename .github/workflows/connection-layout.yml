name: Connection layout
on:
  workflow_dispatch:
  pull_request:
    paths: ['src/**', 'tests/connection-visual/**', '.github/workflows/connection-layout.yml']
permissions:
  contents: read
jobs:
  browser-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 11.25.0
          runtime: node@24
          install: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - name: Check wizard types and behavior before browser layout
        run: |
          pnpm exec tsc -b
          pnpm exec vitest run src/DirectConnectionSetup.test.tsx src/ConnectionDiagnostics.test.tsx
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Check production connection components at phone and desktop widths
        shell: bash
        run: |
          pnpm exec vite --config tests/connection-visual/vite.config.ts > /tmp/mesh-layout.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:1421/ >/dev/null && break; sleep 1; done
          python tests/connection-visual/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connection-layout-evidence
          path: dist/connection-layout/**
