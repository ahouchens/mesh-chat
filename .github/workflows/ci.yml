name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 11.25.0
          runtime: node@24
          cache: true
          install: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            service/requirements.lock
            service/requirements-dev.lock

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r service/requirements-dev.lock

      - name: Validate and test
        run: python scripts/release.py verify

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-chat-verification
          path: dist/reports/**
          if-no-files-found: warn
          retention-days: 14

  desktop-host:
    name: Check Windows desktop host
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 11.25.0
          runtime: node@24
          cache: true
          install: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            service/requirements.lock
            service/requirements-dev.lock
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ci-windows-desktop
      - uses: actions/cache@v5
        with:
          path: |
            service/build
            service/dist
            src-tauri/binaries
          key: ci-pyinstaller-${{ runner.os }}-${{ hashFiles('service/src/**/*.py', 'service/entrypoint.py', 'service/mesh-chat-service.spec', 'service/requirements*.lock', 'service/pyproject.toml', 'scripts/build_sidecar.py') }}
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --disable-pip-version-check -r service/requirements-dev.lock
      - run: pnpm build
      - run: python scripts/build_sidecar.py
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
