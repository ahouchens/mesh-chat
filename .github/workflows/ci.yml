name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 11.19.0
          runtime: node@24
          cache: true
          install: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            service/requirements.lock
            service/requirements-dev.lock

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r service/requirements-dev.lock

      - name: Validate and test
        run: python scripts/release.py verify

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-chat-verification
          path: dist/reports/**
          if-no-files-found: warn
          retention-days: 14
