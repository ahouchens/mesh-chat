name: CI

on:
  workflow_call:
    inputs:
      b8_diagnostic_producer:
        description: Isolate the paired first cold producer from ordinary CI concurrency
        type: boolean
        required: false
        default: false
      public_pair_producer:
        description: Isolate the public fresh-pair producer from ordinary CI concurrency
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      windows_candidate_pair:
        description: Run diagnostic Windows SDK candidate pairs and the Python-owned consumer
        type: boolean
        required: false
        default: false
      packaged_media_preflight:
        description: Build and install the Windows app for a diagnostic WebView2 audio capture preflight
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ inputs.b8_diagnostic_producer && '-b8-first-cold' || inputs.public_pair_producer && '-public-pair' || github.event_name == 'workflow_dispatch' && inputs.packaged_media_preflight && '-media-preflight' || '' }}
  cancel-in-progress: ${{ !(inputs.b8_diagnostic_producer || inputs.public_pair_producer || (github.event_name == 'workflow_dispatch' && inputs.packaged_media_preflight)) }}

jobs:
  media_preflight:
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.packaged_media_preflight == true && needs.verify.result == 'success' }}
    uses: ./.github/workflows/packaged-media-preflight.yml

  verify:
    name: Verify and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      candidate_sdk_artifact_id: ${{ steps.candidate_sdk_upload.outputs.artifact-id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 11.25.0
          runtime: node@24
          cache: true
          install: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            service/requirements.lock
            service/requirements-dev.lock

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r service/requirements-dev.lock

      - name: Prove UI serialization and uncertain enqueue through the production Core
        run: python scripts/check_core_ui_boundary.py --expected-source "${{ github.sha }}"

      - name: Build and test the experimental core client
        run: |
          node node_modules/typescript/bin/tsc -p sdk/typescript
          node --test "sdk/typescript/dist/**/*.test.js"

      - name: Stage standalone artifacts before broad installed-consumer collection
        run: python scripts/stage_core_sdk.py --expected-source "${{ github.sha }}"

      - name: Prove the TypeScript client against the Python facade
        run: |
          node --version
          python -m pytest service/tests/test_sdk_conformance.py -q

      - name: Validate and test
        run: python scripts/release.py verify

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-chat-verification
          path: dist/reports/**
          if-no-files-found: warn
          retention-days: 14
      - name: Retain candidate public SDK staging inputs
        id: candidate_sdk_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-sdk-verification-${{ github.sha }}
          path: |
            dist/sdk/**
            dist/sdk-upgrade/**
            dist/reports/core-sdk-distribution-staging.json
          if-no-files-found: error
          retention-days: 14

  desktop-host:
    name: Check Windows desktop host
    needs: verify
    if: ${{ !cancelled() && (inputs.windows_candidate_pair != true || needs.verify.result == 'success') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 11.25.0
          runtime: node@24
          cache: true
          install: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            service/requirements.lock
            service/requirements-dev.lock
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ci-windows-desktop
      - uses: actions/cache@v5
        with:
          path: |
            service/build
            service/dist
            src-tauri/binaries
          key: ci-pyinstaller-${{ runner.os }}-${{ hashFiles('service/src/**/*.py', 'service/entrypoint.py', 'service/mesh-chat-service.spec', 'service/requirements*.lock', 'service/pyproject.toml', 'scripts/build_sidecar.py') }}
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --disable-pip-version-check -r service/requirements-dev.lock
      - name: Prove settings and call mutations through the actual Windows app pipe
        run: python scripts/check_core_windows_boundary.py --expected-source "${{ github.sha }}"
      - run: pnpm build
      - run: python scripts/build_sidecar.py
      - name: Verify notices and native materials inside the frozen runtime archive
        run: python scripts/native_runtime_materials.py --expected-source "${{ github.sha }}"
      - name: Qualify independently installed SDK and normal Windows runtime with EFS
        run: python scripts/check_independent_core_consumers.py --expected-source "${{ github.sha }}"
      - name: Qualify public SDK pairing and receipts between normal Windows application hosts
        run: python scripts/check_independent_core_pairing.py --expected-source "${{ github.sha }}"
      - name: Qualify packaged native WebRTC messaging
        run: python scripts/check_native_windows_messaging.py --expected-source "${{ github.sha }}"
      - name: Soak packaged native WebRTC messaging
        run: python scripts/check_native_windows_messaging_soak.py --expected-source "${{ github.sha }}"
      - name: Qualify initialized packaged service shutdown and process recovery
        run: python scripts/test_packaged_lifecycle.py --expected-source "${{ github.sha }}"
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Qualify the private core API pipe endpoint
        run: python -m pytest service/tests/test_core_pipe_windows.py -q

      - name: Qualify the packaged wheel over the private pipe endpoint
        run: python scripts/check_packaged_pipe_consumer.py

      - name: Qualify the packaged wheel with owner-scoped grants
        env:
          MESH_CHAT_PIPE_SCOPE: owner
        run: python scripts/check_packaged_pipe_consumer.py

      - name: Qualify a packaged consumer message after host restart
        run: python scripts/check_packaged_pipe_restart.py

      - name: Check experimental shared WebView host
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --features experimental-shared-webview
      - name: Build isolated WebView2 qualification executable
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --bin mesh-transport-qualification --features transport-qualification
      - name: Exercise real WebView2 through the private host pipe
        run: python scripts/test_desktop_transport.py --expected-source "${{ github.sha }}"
      - name: Qualify frozen peers and receipts across a service crash
        run: python scripts/test_packaged_transport.py --expected-source "${{ github.sha }}"
      - name: Qualify explicit first-time approval and paired messaging
        run: python scripts/test_packaged_transport.py --pairing --expected-source "${{ github.sha }}"
      - name: Download exact-run candidate SDK staging
        id: candidate_sdk_download
        if: ${{ always() && inputs.windows_candidate_pair == true && needs.verify.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: core-sdk-verification-${{ github.sha }}
          path: dist
      - name: Assemble exact Windows candidate pair inputs
        id: candidate_assembly
        if: ${{ always() && inputs.windows_candidate_pair == true && needs.verify.result == 'success' }}
        run: python scripts/assemble_windows_candidate_pair.py --expected-source "${{ github.sha }}" --verification-artifact-id "${{ needs.verify.outputs.candidate_sdk_artifact_id }}" --output-dir "$env:RUNNER_TEMP\mesh-windows-candidate-pair-input" --report dist/reports/windows-candidate-pair-assembly.json --retained-manifest dist/reports/windows-candidate-pair-manifest.json
      - name: Exercise installed Windows candidate pair
        if: ${{ always() && inputs.windows_candidate_pair == true && steps.candidate_assembly.outcome == 'success' }}
        run: python tests/core-sdk-upgrade/windows_candidate_pair.py --manifest "$env:RUNNER_TEMP\mesh-windows-candidate-pair-input\manifest.json" --expected-source "${{ github.sha }}" --output dist/reports/windows-candidate-pair.json
      - name: Exercise installed Python SDK with its own normal Windows host
        if: ${{ always() && inputs.windows_candidate_pair == true && needs.verify.result == 'success' && steps.candidate_sdk_download.outcome == 'success' }}
        run: python scripts/check_python_independent_consumer.py --expected-source "${{ github.sha }}"
      - name: Retain diagnostic Python-owned Windows consumer evidence
        if: ${{ always() && inputs.windows_candidate_pair == true }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-independent-python-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/reports/windows-independent-python.json
            dist/reports/windows-independent-python-sdk/**
          if-no-files-found: warn
          retention-days: 14
      - name: Retain diagnostic Windows candidate pair evidence
        if: ${{ always() && inputs.windows_candidate_pair == true }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-candidate-pair-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/reports/windows-candidate-pair-assembly.json
            dist/reports/windows-candidate-pair.json
            dist/reports/windows-candidate-pair-manifest.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-transport-${{ github.sha }}
          path: |
            dist/reports/desktop-transport.json
            dist/reports/packaged-lifecycle.json
            dist/reports/packaged-transport.json
            dist/reports/packaged-pairing.json
            dist/reports/core-windows-boundary.*
            dist/reports/native-windows-control.json
            dist/reports/native-windows-lifecycle.json
            dist/reports/native-runtime-materials.json
            dist/reports/windows-independent-bootstrap.json
            dist/reports/windows-independent-pairing.json
            dist/reports/windows-independent-sdk/**
          if-no-files-found: error
      - name: Retain the exact tested native Windows sidecar and build inputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows-tested-${{ github.sha }}
          path: |
            src-tauri/binaries/mesh-chat-service-x86_64-pc-windows-msvc.exe
            src-tauri/binaries/.mesh-chat-service-x86_64-pc-windows-msvc.build.json
            dist/reports/native-windows-control.json
            dist/reports/native-windows-lifecycle.json
            dist/reports/native-runtime-materials.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
