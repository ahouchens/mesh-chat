name: Direct Fabric feasibility

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-peers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install protected service for identity binding proof
        run: python -m pip install ./service pytest
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Test and build shipping native dispatcher harness
        run: |
          cargo test --locked --manifest-path experiments/direct-app-host/Cargo.toml
          cargo build --locked --manifest-path experiments/direct-app-host/Cargo.toml
      - name: Install Linux syscall observer
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: Qualify two-sided checks behind isolated real NAT filters
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y iproute2 iptables conntrack
          sudo --preserve-env=GITHUB_ACTIONS "$(command -v python)" service/tools/direct_nat_harness.py --binary "$PWD/experiments/direct-app-host/target/debug/mesh-direct-app-host-proof" --report direct-nat-evidence.json
      - name: Retain NAT evidence and negative control
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-nat-evidence
          path: direct-nat-evidence.json
      - name: Production durable recovery through shipping dispatcher
        shell: bash
        run: |
          binary="$PWD/experiments/direct-app-host/target/debug/mesh-direct-app-host-proof"
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary="$binary.exe"; fi
          export MESH_DIRECT_APP_HOST_BINARY="$binary"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            python service/tools/direct_network_audit.py --report direct-recovery-network-evidence.json -- python scripts/direct_qualification.py --suite recovery --expected-source "$GITHUB_SHA"
          else
            python scripts/direct_qualification.py --suite recovery --expected-source "$GITHUB_SHA"
          fi
      - name: Retain production recovery network provenance
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@v4
        with:
          name: direct-recovery-network-evidence
          path: direct-recovery-network-evidence.json
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Validate service binding boundaries
        run: python -m pytest service/tests/test_direct_binding.py service/tests/test_direct_runtime.py service/tests/test_direct_native.py service/tests/test_direct_candidates.py service/tests/test_direct_packets.py service/tests/test_direct_network_audit.py service/tests/test_network_callback_dispatch.py service/tests/test_direct_offer.py service/tests/test_direct_exchange.py service/tests/test_direct_packet_adapter.py service/tests/test_direct_packet_policy.py service/tests/test_udp_mapping.py -q
      - name: Validate workspace and pending join binding authority
        run: python -m pytest service/tests/test_workspace_service.py -k "direct_workspace_binding or direct_join_binding or direct_owner_binding or direct_ready" -q
      - name: Validate atomic durable admitted relationship evidence
        run: python -m pytest service/tests/test_direct_relationship.py service/tests/test_direct_recovery.py service/tests/test_direct_recovery_candidates.py -q
      - name: Validate public document codec and protected setup lifecycle
        run: python -m pytest service/tests/test_direct_documents.py service/tests/test_direct_setup.py -q
      - name: Validate isolated bootstrap process boundaries
        run: python -m pytest service/tests/test_direct_bootstrap.py service/tests/test_direct_bootstrap_process.py service/tests/test_direct_bootstrap_authority.py service/tests/test_direct_path.py service/tests/test_direct_admission.py -q
      - name: Test controlled peers (no discovery service)
        env:
          MESH_DIRECT_BINDING_PYTHON: python
        run: cargo test --locked --manifest-path experiments/direct-fabric/Cargo.toml
      - name: Build isolated packet carrier in CI
        run: cargo build --locked --manifest-path experiments/direct-fabric/Cargo.toml --example packet_bridge
      - name: Real RNS and LXMF over native QUIC
        shell: bash
        env:
          MESH_CHAT_RUN_DIRECT_FABRIC_TESTS: '1'
        run: |
          binary="$PWD/experiments/direct-fabric/target/debug/examples/packet_bridge"
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary="$binary.exe"; fi
          export MESH_DIRECT_PROOF_BINARY="$binary"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            python service/tools/direct_network_audit.py --report direct-network-evidence.json -- python scripts/direct_qualification.py --suite fabric --expected-source "$GITHUB_SHA"
          else
            python scripts/direct_qualification.py --suite fabric --expected-source "$GITHUB_SHA"
          fi
      - name: Retain endpoint-free network provenance
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@v4
        with:
          name: direct-network-evidence
          path: direct-network-evidence.json
      - name: Production setup through source packet pipes and shipping native dispatcher
        shell: bash
        run: |
          binary="$PWD/experiments/direct-app-host/target/debug/mesh-direct-app-host-proof"
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary="$binary.exe"; fi
          export MESH_DIRECT_APP_HOST_BINARY="$binary"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            python service/tools/direct_network_audit.py --report direct-setup-network-evidence.json -- python scripts/direct_qualification.py --suite setup --expected-source "$GITHUB_SHA"
          else
            python scripts/direct_qualification.py --suite setup --expected-source "$GITHUB_SHA"
          fi
      - name: Retain production setup network provenance
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@v4
        with:
          name: direct-setup-network-evidence
          path: direct-setup-network-evidence.json
      - name: Retain complete native execution inventories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-qualification-${{ runner.os }}-${{ github.sha }}
          path: dist/reports/direct/*
          if-no-files-found: error

  android-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager "ndk;28.2.13676358"
      - name: Check Android ARM64 compatibility
        shell: bash
        run: |
          export CC_aarch64_linux_android="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          cargo check --locked --target aarch64-linux-android --manifest-path experiments/direct-fabric/Cargo.toml
