name: Disposable installed Windows release continuity R8 diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-continuity-r8-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installed_continuity:
    name: Published 0.9.66 to exact-source same-version candidate
    runs-on: windows-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          version: 11.25.0
          runtime: node@24
          cache: true
          install: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            service/requirements.lock
            service/requirements-dev.lock
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-windows-desktop
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --disable-pip-version-check -r service/requirements-dev.lock
      - name: Verify release custody and UI contract
        run: |
          python -m unittest discover -s scripts -p "test_windows_release_*.py"
          node --test tests/core-release-upgrade/windows_release_ui_contract.test.mjs tests/core-release-upgrade/windows_release_ui_io.test.mjs
      - name: Build exact source-bound candidate
        run: python scripts/release.py build --platform desktop --skip-tests --report dist/reports/packaged-media-build.json
      - name: Fetch pinned published NSIS release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path '.test-tmp/r8-published' | Out-Null
          gh release download v0.9.66 --repo $env:GITHUB_REPOSITORY --pattern 'Mesh-Chat_0.9.66_x64-setup.exe' --dir '.test-tmp/r8-published'
      - name: Attempt whole-app same-version switch on fresh runner
        shell: pwsh
        run: |
          $tree = (git show -s --format=%T HEAD).Trim()
          python scripts/run_windows_release_continuity.py --baseline-installer '.test-tmp/r8-published/Mesh-Chat_0.9.66_x64-setup.exe' --candidate-source $env:GITHUB_SHA --candidate-tree $tree --run-id $env:GITHUB_RUN_ID --run-attempt $env:GITHUB_RUN_ATTEMPT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-release-continuity-r8-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/reports/windows-release-continuity.json
          if-no-files-found: ignore
          retention-days: 14
