name: Android WebRTC

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'plugins/tauri-plugin-mesh-runtime/**'
      - 'service/**'
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/build_android.py'
      - 'scripts/test_android_webrtc.sh'
      - 'scripts/verify_android_webrtc.py'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android-webrtc.yml'

permissions:
  contents: read

concurrency:
  group: android-webrtc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build and optimized native Chromium interop
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 11.25.0
          runtime: node@24
          cache: true
          install: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: pr-android-arm64-debug
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --disable-pip-version-check -r service/requirements-dev.lock
      - name: Build Android debug APK
        run: python scripts/build_android.py
      - name: Enable KVM for Android interoperability tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build optimized WebRTC test host and instrumentation APK
        working-directory: src-tauri/gen/android
        run: ./gradlew :webrtc-smoke:assembleRelease :webrtc-smoke:assembleReleaseAndroidTest -PmeshWebRtcSmoke=true -PmeshRuntimeAbis=x86_64 --no-configuration-cache
      - name: Verify optimized WebRTC JNI classes
        run: python scripts/verify_android_webrtc.py plugins/tauri-plugin-mesh-runtime/android/webrtc-smoke/build/outputs/apk/release/webrtc-smoke-release.apk
      - name: Test real Chromium and optimized native WebRTC data channels
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/test_android_webrtc.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-webrtc-debug
          path: |
            dist/mobile/**
            dist/reports/**
            plugins/tauri-plugin-mesh-runtime/android/build/reports/androidTests/**
            plugins/tauri-plugin-mesh-runtime/android/build/outputs/androidTest-results/**
            plugins/tauri-plugin-mesh-runtime/android/webrtc-smoke/build/reports/androidTests/**
            plugins/tauri-plugin-mesh-runtime/android/webrtc-smoke/build/outputs/androidTest-results/**
            plugins/tauri-plugin-mesh-runtime/android/webrtc-smoke/build/outputs/mapping/**
          if-no-files-found: warn
          retention-days: 14
