name: Android WebRTC

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      network_inventory:
        description: Read-only disposable emulator network inventory (not qualification)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: android-webrtc-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.network_inventory && '-inventory' || '' }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build and optimized native Chromium interop
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.network_inventory) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 11.25.0
          runtime: node@24
          cache: true
          install: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: pr-android-arm64-debug
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --disable-pip-version-check -r service/requirements-dev.lock
      - name: Build Android debug APK
        run: python scripts/build_android.py
      - name: Enable KVM for Android interoperability tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build optimized WebRTC test host
        working-directory: src-tauri/gen/android
        run: ./gradlew :webrtc-smoke:assembleRelease -PmeshWebRtcSmoke=true -PmeshRuntimeAbis=x86_64 --no-configuration-cache
      - name: Verify optimized WebRTC JNI classes
        run: python scripts/verify_android_webrtc.py plugins/tauri-plugin-mesh-runtime/android/webrtc-smoke/build/outputs/apk/release/webrtc-smoke-release.apk
      - name: Build WebRTC instrumentation APK
        working-directory: src-tauri/gen/android
        run: |
          node ../../../scripts/build_desktop_transport_fixture.mjs
          ./gradlew :webrtc-smoke:assembleReleaseAndroidTest -PmeshWebRtcSmoke=true -PmeshRuntimeAbis=x86_64 --no-configuration-cache
      - name: Free disk for the emulator system image
        run: |
          df -h
          rm -rf "$ANDROID_SDK_ROOT/ndk/28.2.13676358" || true
          rm -rf "$HOME/.rustup" "$HOME/.npm" || true
          rm -rf src-tauri/target node_modules src-tauri/gen/android/app/build || true
          df -h
      - name: Test Chromium interop and Android signalling mailbox recovery
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/test_android_qualification.sh
      - name: Retain required run-bound Android evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-qualification-${{ github.sha }}
          path: dist/reports/android-qualification.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-webrtc-debug
          path: |
            dist/mobile/**
            dist/android-core-consumer/**
            dist/android-independent-consumer/**
            plugins/tauri-plugin-mesh-runtime/android/runtime-host/build/repository/**
            sdk/kotlin/build/repository/**
            sdk/kotlin/build/test-results/**
            sdk/kotlin/build/reports/tests/**
            dist/reports/**
            plugins/tauri-plugin-mesh-runtime/android/webrtc-smoke/build/outputs/apk/release/webrtc-smoke-release.apk
            plugins/tauri-plugin-mesh-runtime/android/webrtc-smoke/build/outputs/apk/androidTest/release/webrtc-smoke-release-androidTest.apk
            plugins/tauri-plugin-mesh-runtime/android/build/outputs/apk/androidTest/debug/tauri-plugin-mesh-runtime-debug-androidTest.apk
            plugins/tauri-plugin-mesh-runtime/android/build/reports/androidTests/**
            plugins/tauri-plugin-mesh-runtime/android/build/test-results/**
            plugins/tauri-plugin-mesh-runtime/android/build/reports/tests/**
            plugins/tauri-plugin-mesh-runtime/android/build/outputs/androidTest-results/**
            plugins/tauri-plugin-mesh-runtime/android/webrtc-smoke/build/reports/androidTests/**
            plugins/tauri-plugin-mesh-runtime/android/webrtc-smoke/build/outputs/androidTest-results/**
            plugins/tauri-plugin-mesh-runtime/android/webrtc-smoke/build/outputs/mapping/**
          if-no-files-found: warn
          retention-days: 14

  network_inventory:
    name: Read-only emulator network inventory (not qualification)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.network_inventory }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Enable KVM for the disposable diagnostic emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the configured native-peer system image
        run: sdkmanager "emulator" "platform-tools" "system-images;android-35;google_apis;x86_64"
      - name: Record read-only command and schema evidence
        run: python -B scripts/native_interop_network_probe.py --output dist/reports/android-network-inventory.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-network-inventory-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/reports/android-network-inventory.json
          if-no-files-found: error
          retention-days: 14
