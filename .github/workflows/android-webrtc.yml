name: Android WebRTC build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'plugins/tauri-plugin-mesh-runtime/**'
      - 'service/**'
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/build_android.py'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android-webrtc.yml'

permissions:
  contents: read

concurrency:
  group: android-webrtc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android arm64 debug
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 11.25.0
          runtime: node@24
          cache: true
          install: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: pr-android-arm64-debug
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --disable-pip-version-check -r service/requirements-dev.lock
      - name: Build Android debug APK
        run: python scripts/build_android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-webrtc-debug
          path: |
            dist/mobile/**
            dist/reports/**
          if-no-files-found: warn
          retention-days: 14
