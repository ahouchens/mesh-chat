name: Android native cold restart diagnostic

on:
  workflow_call:
    inputs:
      repetitions:
        description: Independent emulator runs (1 to 3, declared before execution)
        required: true
        type: number
  workflow_dispatch:
    inputs:
      repetitions:
        description: Independent emulator runs (1 to 3, declared before execution)
        required: true
        type: number
        default: 1

permissions:
  contents: read

jobs:
  android_restart_diagnostic:
    name: Packaged Android reopen diagnostic only
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 11.25.0
          runtime: node@24
          cache: true
          install: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the qualification Android SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: pr-android-arm64-debug
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --disable-pip-version-check -r service/requirements-dev.lock
      - name: Build the same-source Android app
        run: python scripts/build_android.py
      - name: Build the existing optimized native host
        working-directory: src-tauri/gen/android
        run: ./gradlew :webrtc-smoke:assembleRelease -PmeshWebRtcSmoke=true -PmeshRuntimeAbis=x86_64 --no-configuration-cache
      - name: Verify optimized WebRTC JNI classes
        run: python scripts/verify_android_webrtc.py plugins/tauri-plugin-mesh-runtime/android/webrtc-smoke/build/outputs/apk/release/webrtc-smoke-release.apk
      - name: Build the existing instrumentation host
        working-directory: src-tauri/gen/android
        run: |
          node ../../../scripts/build_desktop_transport_fixture.mjs
          ./gradlew :webrtc-smoke:assembleReleaseAndroidTest -PmeshWebRtcSmoke=true -PmeshRuntimeAbis=x86_64 --no-configuration-cache
      - name: Free disk for the emulator system image
        run: |
          df -h
          rm -rf "$ANDROID_SDK_ROOT/ndk/28.2.13676358" || true
          rm -rf "$HOME/.rustup" "$HOME/.npm" || true
          rm -rf src-tauri/target node_modules src-tauri/gen/android/app/build || true
          df -h
      - name: Enable KVM for the packaged peer
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the native peer system image
        run: sdkmanager "emulator" "platform-tools" "system-images;android-35;google_apis;x86_64"
      - name: Run bounded reopen observations
        env:
          RESTART_REPETITIONS: ${{ inputs.repetitions }}
        run: >-
          python -B scripts/native_restart_diagnostic.py
          --expected-source "$GITHUB_SHA"
          --repetitions "$RESTART_REPETITIONS"
          --output dist/reports/native-restart-diagnostic.json
      - name: Retain every diagnostic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-restart-diagnostic-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/reports/native-restart-diagnostic.json
          if-no-files-found: error
          retention-days: 14
