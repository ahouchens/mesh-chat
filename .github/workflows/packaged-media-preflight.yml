name: Packaged Windows media capture preflight

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: packaged-media-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  media_capture:
    name: Installed app WebView2 capture only
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 11.25.0
          runtime: node@24
          cache: true
          install: false
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            service/requirements.lock
            service/requirements-dev.lock
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-windows-desktop
      - uses: actions/cache@v5
        with:
          path: |
            service/build
            service/dist
            src-tauri/binaries
          key: pyinstaller-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('service/src/**/*.py', 'service/entrypoint.py', 'service/mesh-chat-service.spec', 'service/requirements*.lock', 'service/pyproject.toml', 'scripts/build_sidecar.py') }}
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --disable-pip-version-check -r service/requirements-dev.lock
      # The caller requires successful verification for this exact source.
      # This command stages local packages; it creates no release or tag.
      - name: Build same-source Windows installation candidate
        run: python scripts/release.py build --platform desktop --skip-tests --report dist/reports/packaged-media-build.json
      - name: Install candidate and exercise real app media capture
        run: python scripts/run_packaged_media_preflight.py --expected-source "${{ github.sha }}" --delivery-report dist/reports/packaged-media-build.json
      - name: Retain capture-only diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-media-preflight-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/reports/packaged-media-*.json
            dist/desktop/releases/**/manifest.json
          if-no-files-found: error
          retention-days: 14
