[package]
name = "tauri-plugin-mesh-runtime"
version = "0.1.0"
description = "Embedded Reticulum/LXMF runtime for Mesh Chat mobile builds"
authors = ["Mesh Chat contributors"]
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-mesh-runtime"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2" }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
