[package]
name = "mesh-direct-proof"
version = "0.1.0"
license = "MIT"
edition = "2021"
rust-version = "1.88"
publish = false

# Phase-1 qualification passed. The app embeds the private host for Phase 2;
# public bootstrap/interface activation remains service-owned and separately gated.
[dependencies]
bytes = "=1.10.1"
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "=0.13.2", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring"] }
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "time", "sync"] }

[workspace]
