[package]
name = "mesh-direct-proof"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

# Isolated phase-1 proof. Do not add to the app until the qualification gate in
# docs/adr/0018-authenticated-direct-underlay.md is satisfied.
[dependencies]
bytes = "=1.10.1"
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "=0.13.2", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring"] }
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "time", "sync"] }

[workspace]
