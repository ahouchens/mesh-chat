name = "mesh-chat-signal"
main = "worker.js"
compatibility_date = "2026-10-21"
workers_dev = true

[vars]
WRITES_ENABLED = "true"

[observability]
enabled = false

[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "READ_LIMITER"
namespace_id = "1002"
simple = { limit = 480, period = 60 }

[[durable_objects.bindings]]
name = "SIGNALS"
class_name = "SignalRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalRoom"]
