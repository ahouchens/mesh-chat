include ':app'

apply from: 'tauri.settings.gradle'

include ':mesh-core-client'
project(':mesh-core-client').projectDir = new File(settingsDir, '../../../sdk/kotlin')

if (providers.gradleProperty('meshCoreConsumerQualification').orNull == 'true') {
    include ':core-api-host'
    project(':core-api-host').projectDir = new File(settingsDir, '../../../plugins/tauri-plugin-mesh-runtime/android/core-api-host')
}

// CI-only optimized app host; never bundled in the shipped application.
if (providers.gradleProperty('meshWebRtcSmoke').orNull == 'true') {
    include ':webrtc-smoke'
    project(':webrtc-smoke').projectDir = new File(settingsDir, '../../../plugins/tauri-plugin-mesh-runtime/android/webrtc-smoke')
}
